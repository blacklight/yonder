---
kind: pipeline
type: docker
name: default

trigger:
  event:
    exclude:
      - pull_request

# Shared service containers, reachable from every step by name on the
# pipeline network. `services:` must be a TOP-LEVEL key for docker
# pipelines — a per-step `services:` section is silently ignored and
# the step then fails DNS lookups for these hostnames.
services:
  - name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
  - name: redis
    image: redis:7-alpine

volumes:
  - name: docker_sock
    host:
      path: /var/run/docker.sock
  # NOTE: Requires /home/drone/.cargo/drone to exist (or be symlinked)
  # and be writable by the Drone server UID.
  #
  # Mounted at `registry/cache` — the .crate download archives — NOT
  # the whole registry. registry/src (extractions) and registry/index
  # stay per-step: parallel Rust steps unpacking the same crate into a
  # shared registry/src race and fail with "failed to unpack package
  # ... File exists (os error 17)". Download archives are written
  # atomically, so sharing them is safe — crates are fetched once
  # while each step still extracts/compiles independently.
  - name: cargo_cache
    host:
      path: /home/drone/.cargo/drone
  # Tag pipelines build the release binary + frontend dist once and share
  # them between build-image / publish-crate / github-release via
  # /release/$DRONE_TAG. Requires a writable /home/drone/release-artifacts
  # on the Drone host (tag subdirs accumulate — prune periodically).
  - name: release_artifacts
    host:
      path: /home/drone/release-artifacts

steps:

###
### Backend lint
###

- name: backend-lint
  image: rust:1
  volumes:
    - name: cargo_cache
      path: /usr/local/cargo/registry/cache
  commands:
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo clippy --all-targets -- -D warnings

  when:
    event:
      - push
    paths:
      include:
        - src/**
        - tests/**
        - migrations/**
        - Cargo.*

###
### Frontend build
###

- name: frontend-build
  image: node:24
  commands:
    # Skip lifecycle scripts: esbuild's postinstall rewrites and then
    # immediately spawns its binary, which can fail on CI filesystems.
    # The esbuild platform binary ships as an optional dependency, so
    # the build works without the script.
    - cd frontend && npm ci --ignore-scripts && npm run build

  when:
    event:
      - push
      - tag
    paths:
      include:
        - frontend/**

###
### Backend tests
###
### `cargo test` doubles as the release build input — there is no
### separate `cargo build` step, so the workspace compiles exactly once
### per run and the cargo_cache volume keeps dependencies warm across
### runs on the shared CI host.
###
### docker.sock is deliberately NOT mounted: the e2e harness's
### container-spawning tests (dedicated_redis, media) would see a
### runtime, start a sibling container, then fail connecting from
### inside this step. Without the socket they skip cleanly.

- name: backend-tests
  image: rust:1
  volumes:
    - name: cargo_cache
      path: /usr/local/cargo/registry/cache

  environment:
    # Each test provisions its own yonder_t_<slug> database and Redis
    # key prefix — the PG URL points at the server, not a database.
    YONDER_TEST_PG_URL: postgres://postgres:postgres@postgres:5432
    YONDER_TEST_REDIS_URL: redis://redis:6379

  commands:
    # aws-lc-sys (lettre) compiles C code — the full rust image has a
    # C toolchain but no cmake.
    - apt-get update && apt-get install -y cmake curl
    # cargo llvm-cov wraps `cargo test` with coverage instrumentation —
    # the test run doubles as the coverage report input (lcov.info
    # stays in the shared workspace for the codacy-coverage step).
    - rustup component add llvm-tools-preview
    - curl -fsSL https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/cargo/bin
    - cargo llvm-cov --locked --lcov --output-path lcov.info

  when:
    event:
      - push
    paths:
      include:
        - src/**
        - tests/**
        - migrations/**
        - Cargo.*

###
### Frontend lint
###

- name: frontend-lint
  image: node:24
  commands:
    - cd frontend && npm run lint && ./node_modules/.bin/prettier --check src
  when:
    event:
      - push
    paths:
      include:
        - frontend/**
  depends_on:
    - frontend-build

###
### Frontend tests
###

- name: frontend-tests
  image: node:24
  commands:
    - cd frontend && npm run test
  when:
    event:
      - push
    paths:
      include:
        - frontend/**
  depends_on:
    - frontend-build

###
### Release build (tag only)
###
### The binary and frontend dist are built ONCE here and consumed by
### build-image (prebuilt/yonder in the Docker context), publish-crate
### (ordering) and github-release (tarball). Artifacts land in the
### shared release_artifacts volume under /release/$DRONE_TAG.
###

- name: build-binary
  image: rust:1
  volumes:
    - name: cargo_cache
      path: /usr/local/cargo/registry/cache
    - name: release_artifacts
      path: /release

  commands:
    # aws-lc-sys (lettre) compiles C code — same toolchain bits as
    # backend-tests (full rust image has gcc but no cmake).
    - apt-get update && apt-get install -y cmake curl
    - cargo build --release --locked
    - mkdir -p "/release/$DRONE_TAG"
    - cp target/release/yonder "/release/$DRONE_TAG/yonder"

  when:
    event:
      - tag

- name: build-frontend-dist
  image: node:24
  volumes:
    - name: release_artifacts
      path: /release

  commands:
    # Same --ignore-scripts rationale as frontend-build.
    - cd frontend && npm ci --ignore-scripts && npm run build
    - mkdir -p "/release/$DRONE_TAG/frontend"
    - cp -r frontend/dist "/release/$DRONE_TAG/frontend/dist"

  when:
    event:
      - tag

###
### Build and publish the Docker image (x86_64 — see
### .drone/build-image.sh)
###

- name: build-image
  image: docker
  privileged: true
  volumes:
    - name: docker_sock
      path: /var/run/docker.sock
    - name: release_artifacts
      path: /release

  environment:
    REGISTRY_ENDPOINT: quay.io
    IMAGE_NAME: quay.io/yonder/yonder
    DOCKER_USER:
      from_secret: docker_user
    DOCKER_PASS:
      from_secret: docker_pass

  when:
    event:
      - tag

  depends_on:
    - build-binary

  commands:
    # Stage the prebuilt binary into the Docker build context — the
    # Dockerfile copies it instead of recompiling (see Dockerfile).
    - mkdir -p prebuilt && cp "/release/$DRONE_TAG/yonder" prebuilt/yonder
    - . .drone/build-image.sh

###
### Publish the crate to crates.io as `yonder-server`
###

- name: publish-crate
  image: rust:1
  volumes:
    - name: cargo_cache
      path: /usr/local/cargo/registry/cache

  environment:
    CARGO_REGISTRY_TOKEN:
      from_secret: crates_io_token

  when:
    event:
      - tag

  depends_on:
    - build-binary

  commands:
    - . .drone/publish-crate.sh

###
### GitHub release: .tar.xz (binary + frontend dist + example config)
###

- name: github-release
  image: alpine
  volumes:
    - name: release_artifacts
      path: /release

  environment:
    GH_TOKEN:
      from_secret: github_token

  when:
    event:
      - tag

  depends_on:
    - build-binary
    - build-frontend-dist

  commands:
    - apk add --no-cache xz github-cli
    - . .drone/github-release.sh

###
### Upload coverage to Codacy
###

- name: codacy-coverage
  image: alpine
  depends_on:
    - backend-tests
  when:
    branch:
      - main
    event:
      - push
    paths:
      include:
        - src/**
        - tests/**
        - migrations/**
        - Cargo.*

  environment:
    CODACY_PROJECT_TOKEN:
      from_secret: codacy_project_token

  commands:
    - apk add --update --no-cache bash curl
    - curl -fsSL https://coverage.codacy.com/get.sh -o /tmp/codacy-coverage.sh
    - bash /tmp/codacy-coverage.sh report -r lcov.info --commit-uuid "$DRONE_COMMIT_SHA"
