[package]
name = "yonder"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "A Mastodon-compatible ActivityPub server in Rust"
repository = "https://git.platypush.tech/blacklight/yonder"
keywords = ["activitypub", "fediverse", "federation", "mastodon"]

# axum 0.8, redis 0.27 and thiserror 2 are pinned to match pubby-sdk's
# dependency versions — types from these crates cross the pubby boundary
[dependencies]
arc-swap = "=1.9.2" # pinned: 1.9.3 published <7 days ago at add time
argon2 = "0.5"
async-trait = "0.1"
# S3 media backend. Pinned to a >=7-day-old release; 1.153+
# postdates the cutoff. `cargo update -p aws-sdk-s3 --precise` pins the
# lockfile to it.
aws-sdk-s3 = "1.152.0"
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.22"
bb8 = "0.8"
bb8-redis = "0.17"
blurhash = "0.2.3"
chacha20poly1305 = "0.10"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
csv = "1.3"
dotenvy = "0.15"
figment = { version = "0.10", features = ["env", "toml"] }
futures-util = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
hostname = "0.4"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
] }
# SMTP transport for the epic-22 `EmailSend` job (replaces the stub).
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "tokio1",
    "tokio1-rustls",
    "aws-lc-rs",
    "rustls-native-certs",
] }
# VAPID keypair generation for the admin "generate keys" action (epic
# 22; push delivery itself lands in a later epic).
p256 = { version = "0.14", features = ["ecdsa", "arithmetic", "getrandom"] }
pubby-sdk = { version = "0.6.5", features = ["axum", "redis", "async"] }
redis = "0.27"
rsa = "0.9"
scraper = { version = "0.27", features = ["atomic"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.1"
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "json",
    "migrate",
    "macros",
    "chrono",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-cron-scheduler = { version = "0.15", default-features = false }
tokio-util = "0.7"
totp-rs = { version = "6.0", features = ["otpauth", "qr"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
utoipa = "6.0.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
uuid = { version = "1", features = ["v4"] }
# `zip` writes the account-archive export; the `deflate` feature pulls
# the pure-Rust flate2 backend — no crypto backends.
zip = { version = "2", default-features = false, features = ["deflate"] }
# `danger-allow-state-serialisation`: ceremony state
# (SecurityKeyRegistration/SecurityKeyAuthentication) is serialized to
# Redis between begin/finish — the documented way to persist it.
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
pulldown-cmark = "0.13.5"
ammonia = "4.2.4"
quick-xml = "0.42"

[dev-dependencies]
base64 = "0.22"
figment = { version = "0.10", features = ["env", "toml", "test"] }
testcontainers = { version = "0.24", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.12", features = ["postgres", "redis", "minio"] }
tokio-tungstenite = "0.29"
tower = "0.5.3"
webauthn-authenticator-rs = { version = "0.5.5", features = ["softtoken"] }
