[package]
name = "yonder"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "A Mastodon-compatible ActivityPub server in Rust"
repository = "https://git.platypush.tech/blacklight/yonder"
keywords = ["activitypub", "fediverse", "federation", "mastodon"]

# axum 0.8, redis 0.27 and thiserror 2 are pinned to match pubby-sdk's
# dependency versions — types from these crates cross the pubby boundary
# once epic 06 lands the federation integration.
[dependencies]
async-trait = "0.1"
axum = "0.8"
bb8 = "0.8"
bb8-redis = "0.17"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
figment = { version = "0.10", features = ["env", "toml"] }
hostname = "0.4"
redis = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-cron-scheduler = { version = "0.15", default-features = false }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
figment = { version = "0.10", features = ["env", "toml", "test"] }
testcontainers = "0.24"
testcontainers-modules = { version = "0.12", features = ["postgres", "redis"] }
