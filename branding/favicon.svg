<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Yonder">
  <!--
    Yonder favicon: the logo mark re-weighted for tiny sizes. The horizon
    arc is dropped (it turns to mud at 16px) and the remaining shapes are
    drawn heavier so they survive downscaling. Same construction as
    logo.svg: connection lines run from the home circle's center outward,
    drawn beneath equal-sized node dots. Distant nodes carry a lighter
    tint of the brand color, matching logo.svg.
  -->
  <style>
    .brand-fill { fill: #0d9488; }
    .brand-node { fill: #2dd4bf; }
    .brand-stroke { fill: none; stroke: #0d9488; stroke-linecap: round; }
  </style>

  <g id="rays">
    <path class="brand-stroke" stroke-width="32" d="M256 335 L256 80"/>
    <path class="brand-stroke" stroke-width="32" d="M256 335 L92 140"/>
    <path class="brand-stroke" stroke-width="32" d="M256 335 L420 140"/>
  </g>

  <g id="nodes">
    <circle class="brand-node" cx="256" cy="80" r="50"/>
    <circle class="brand-node" cx="92" cy="140" r="50"/>
    <circle class="brand-node" cx="420" cy="140" r="50"/>
  </g>

  <g id="home">
    <circle class="brand-fill" cx="256" cy="335" r="105"/>
  </g>
</svg>
