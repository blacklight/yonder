# Yonder deployment — app + worker + Postgres + Redis + nginx.
#
# Before the first `up`:
#   1. Copy `.env.example` to `.env` and edit it (PUID/PGID, domain, …).
#   2. Create `./config.toml` (see `config.toml.example`) — the
#      `create_host_path: false` bind below fails loudly when it is
#      missing instead of creating a root-owned directory.
#
# Nginx fronts the stack on ${YONDER_HTTP_PORT:-80}; the app and worker
# are internal. Push notifications need the VAPID keys — generate once
# with `docker compose run --rm yonder webpush generate-keys` and put
# them in `.env` (or config.toml).

# Mount the top-level config.toml into the containers. The long bind
# syntax with create_host_path=false makes Compose fail loudly if the
# file is missing instead of auto-creating a root-owned directory on
# the host.
x-config-mount: &config-mount
  type: bind
  source: ./config.toml
  target: /etc/yonder/config.toml
  read_only: true
  bind:
    create_host_path: false

# Inject .env into the yonder containers as well as using it for
# Compose variable interpolation, so secrets (YONDER_AUTH__SECRET_KEY,
# SMTP/VAPID keys, ...) and YONDER_* overrides defined there reach the
# services.
x-env-file: &env-file
  - path: .env
    required: false

services:
  setup:
    image: alpine:latest
    container_name: yonder-setup
    user: "0:0"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./volumes:/volumes
    command:
      - /bin/sh
      - -c
      - mkdir -p /volumes/data /volumes/db /volumes/redis && chown -R "$${PUID}:$${PGID}" /volumes
    restart: "no"

  yonder:
    image: quay.io/yonder/yonder
    # Or uncomment the following lines if you want to build the image
    # from the local checkout
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     USER_ID: ${PUID:-1000}
    #     GROUP_ID: ${PGID:-1000}
    container_name: yonder-app
    user: ${PUID:-1000}:${PGID:-1000}
    env_file: *env-file
    environment: &yonder-env
      YONDER_CONFIG: /etc/yonder/config.toml
      YONDER_DATABASE__URL: postgres://yonder:yonder@postgres:5432/yonder
      YONDER_REDIS__URL: redis://redis:6379/0
      YONDER_SERVER__HOST: 0.0.0.0
      YONDER_SERVER__PORT: "3000"
      # nginx sits in front — one trusted proxy hop.
      YONDER_SERVER__TRUSTED_PROXY_HOPS: "1"
      # The worker service owns the job queues.
      YONDER_JOBS__ENABLED: "false"
      YONDER_MEDIA__BACKEND: local
      YONDER_MEDIA__LOCAL_PATH: /data/media
      YONDER_FRONTENDS__DIR: /data/frontends
      YONDER_FRONTENDS__BUILTIN_DIR: /home/yonder/frontend/dist
      YONDER_INSTANCE__DOMAIN: ${YONDER_INSTANCE__DOMAIN:-localhost}
      YONDER_INSTANCE__NAME: ${YONDER_INSTANCE__NAME:-Yonder}
      YONDER_INSTANCE__DESCRIPTION: ${YONDER_INSTANCE__DESCRIPTION:-A Mastodon-compatible ActivityPub server}
      YONDER_AUTH__REGISTRATION_MODE: ${YONDER_AUTH__REGISTRATION_MODE:-open}
      HOME: /home/yonder
    command: ["serve"]
    volumes:
      - *config-mount
      - ./volumes/data:/data
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    image: quay.io/yonder/yonder
    # Or uncomment the following lines if you want to build the image
    # from the local checkout
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     USER_ID: ${PUID:-1000}
    #     GROUP_ID: ${PGID:-1000}
    container_name: yonder-worker
    user: ${PUID:-1000}:${PGID:-1000}
    env_file: *env-file
    environment:
      <<: *yonder-env
    command: ["worker"]
    volumes:
      - *config-mount
      - ./volumes/data:/data
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: yonder-nginx
    ports:
      - "${YONDER_HTTP_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./docker/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      # The media dir mounts at /srv/media so nginx's `location /media/
      # { root /srv; try_files … }` resolves keys without the alias bug.
      - type: bind
        source: ./volumes/data/media
        target: /srv/media
        read_only: true
        bind:
          create_host_path: true
    depends_on:
      - yonder
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: yonder-postgres
    user: ${PUID:-1000}:${PGID:-1000}
    # Headroom above the default 100 connections: the app and the
    # worker each keep bounded pools, and the surplus absorbs bursts
    # that queue on pooled connections.
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: yonder
      POSTGRES_PASSWORD: yonder
      POSTGRES_DB: yonder
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: yonder-redis
    user: ${PUID:-1000}:${PGID:-1000}
    volumes:
      - ./volumes/redis:/data
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  default:
    name: yonder
