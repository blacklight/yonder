# --- Federation stampede defenses ----------------------------------------
#
# A boosted post makes hundreds of remote instances dereference the same
# actor/object URLs at once. The edge cache serves repeat fetches without
# touching the application and ``proxy_cache_lock`` folds concurrent misses
# into a single upstream render.
#
# The optional per-IP rate limit (see the federation location below) is
# only safe once nginx resolves the real client address — deployments that
# sit behind a front proxy otherwise throttle all remote instances as one
# bucket keyed on the proxy's address.

# Only dereference reads are throttled. Inbox POSTs must never be
# rate-limited here: Mastodon retries rejected deliveries, which
# amplifies the very burst the limit is meant to dampen. An empty zone
# key is not limited.
map $request_method $yonder_fedread_key {
    GET     $binary_remote_addr;
    HEAD    $binary_remote_addr;
    default "";
}
limit_req_zone $yonder_fedread_key zone=yonder_fedread:10m rate=10r/s;

proxy_cache_path /var/cache/nginx/yonder-fedoc
    levels=1:2 keys_zone=yonder_fedoc:16m max_size=256m inactive=10m
    use_temp_path=off;

# Normalize the dereference content negotiation into the cache key.
# Only ``activity+json`` and ``ld+json`` request an AP document
# (``jrd+json`` does not), and a client accepting both AP and HTML is a
# third variant because web permalinks (``/@acct``, ``/@acct/{id}``)
# answer it with the SPA shell instead of the document.
# ``*/*`` counts as HTML-capable, mirroring the app's negotiation.
map $http_accept $yonder_accept_class {
    ~*(application/activity\+json|application/ld\+json).*(text/html|\*/\*) "ap+html";
    ~*(text/html|\*/\*).*(application/activity\+json|application/ld\+json) "ap+html";
    ~*(application/activity\+json|application/ld\+json) "ap";
    default "html";
}

# Only anonymous AP-JSON fetches may be served from or stored in the
# edge cache. Credential-bearing requests (cookie, Authorization) always
# reach the app. Signed fetches (HTTP ``Signature``) bypass too: a
# cached anonymous answer — especially a 404 on a followers-only object
# — must never hide a document a verified signer can see, and a private
# document a signer received must never be stored for anonymous
# readers. The app additionally marks private answers
# ``X-Accel-Expires: 0``/``no-store`` (src/activitypub/edge.rs) as
# defense in depth. The exact-match "ap" below requires the AP class
# AND all three credential variables empty.
map "$yonder_accept_class$http_cookie$http_authorization$http_signature" $yonder_no_cache {
    "ap"    0;
    default 1;
}

server {
    listen 80;
    server_name _;

    # media.max_upload_size is 50 MiB — headroom for multipart overhead.
    client_max_body_size 60m;

    # Deployment-specific: when a front proxy terminates traffic in front
    # of this nginx, set its CIDR here so $remote_addr — and therefore the
    # federation rate limit and the access log — reflects the real client
    # instead of the proxy. Only then is it safe to enable the limit_req
    # directives in the federation location below.
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # Rejected dereference reads return 429 (Retry-After friendly), not
    # the 503 default that remote instances amplify with retries.
    limit_req_status 429;

    # Docker's embedded DNS resolver re-resolves service hostnames when
    # containers are recreated.
    resolver 127.0.0.11 valid=30s;
    set $yonder "http://yonder:3000";

    # Mastodon streaming API over WebSocket — the server pings every
    # 30 s, but a long read timeout keeps idle sockets cheap.
    location /api/v1/streaming {
        proxy_pass $yonder;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Local media served directly from the read-only volume mount —
    # skips the app entirely for the `local` backend. Misses and the
    # `s3` backend (which has no files on this mount) fall through to
    # the app's own media route. `root` + `try_files` is used instead
    # of `alias` because try_files inside an alias location appends the
    # full URI (nginx ticket #97).
    location /media/ {
        root /srv;
        try_files $uri @yonder_media;
        # Exactly the header the app emits (src/media/storage.rs) —
        # `expires` would add a second, different Cache-Control.
        add_header Cache-Control "public, max-age=31556952, immutable";
    }

    location @yonder_media {
        proxy_pass $yonder;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ActivityPub dereference endpoints: edge-cached with single-flighted
    # misses. GET/HEAD documents are cached briefly (the app emits a
    # matching X-Accel-Expires); non-GET requests (inbox POSTs) are
    # never cached and never rate-limited here.
    #
    # The per-IP read limit below MUST stay disabled until real_ip_* is
    # configured for the front proxy (see the top of this server block) —
    # otherwise every remote instance shares the proxy's bucket.
    location ~ ^/(ap/|users/|@|nodeinfo/|\.well-known/(webfinger|nodeinfo|host-meta)) {
        # limit_req zone=yonder_fedread burst=20 nodelay;

        proxy_pass $yonder;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache yonder_fedoc;
        proxy_cache_key "$scheme://$host$request_uri $yonder_accept_class";
        proxy_cache_methods GET HEAD;
        # Cache only anonymous AP-JSON fetches; HTML, credential-bearing
        # and signed requests always reach (and are never stored from)
        # the app.
        proxy_cache_bypass $yonder_no_cache;
        proxy_no_cache $yonder_no_cache;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # The app's AP responses do not currently emit ``Vary: Accept``.
        # Honoring a future Vary would key one variant per distinct
        # remote ``Accept`` string (Mastodon, Misskey, GoToSocial, …)
        # instead of one per normalized class — ignore it. The header
        # still passes through to clients untouched.
        proxy_ignore_headers Vary;
        # Edge freshness policy: the app bounds every cacheable response
        # with ``X-Accel-Expires`` (src/activitypub/edge.rs) — anonymous
        # documents get the TTL below, private/credential answers get 0
        # and are never stored. ``proxy_cache_valid`` is only the
        # fallback for responses that lack the header and must match
        # the app's EDGE_TTL_SECS. Stale serving is deliberately NOT
        # enabled: outage resilience comes from the app's own
        # doc-cache staleness, and a hard edge staleness bound is worth
        # more than serving expired copies during an app outage.
        proxy_cache_valid 200 15s;
        proxy_cache_valid 404 15s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Everything else is served by the application itself: the Mastodon
    # API, OAuth, feeds, /swagger-ui + /openapi.json, the built frontend
    # assets and the SPA shell.
    location / {
        proxy_pass $yonder;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
